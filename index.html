:root{ --red:#ff0000; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:#000; }
body{ font-family:"Muoto",sans-serif; }

/* ---------- Photos : défilement vertical ---------- */
/* Au-delà d'un format 4/3, les photos restent dans une colonne 4/3 centrée : bandes noires sur les côtés */
main{ width:min(100%, calc(100vh * 4 / 3)); width:min(100%, calc(100svh * 4 / 3)); margin-inline:auto; }
.slide{ position:relative; width:100%; height:100vh; height:100svh; overflow:hidden; }
.slide::after{ content:""; position:absolute; inset:0; background:rgba(0,0,0,.4); pointer-events:none; }
.slide img{ display:block; width:100%; height:100%; object-fit:cover; object-position:center; }

/* ---------- Affiche : toujours à l'écran ---------- */
.poster{
  position:fixed; left:50%; top:50%;
  width:min(100vw, 75svh); aspect-ratio:3/4;
  transform:translate(-50%,-50%);
  container-type:inline-size;
  color:var(--red);
  mix-blend-mode:lighten;
  pointer-events:none;
  --k:calc(100cqw / 1170);          /* 1 px du visuel d'origine (1170 de large) */
}
.poster > *{ position:absolute; translate:calc(-7.5*var(--k)) calc(31.02*var(--k)); } /* recentre le contenu dans la page */
.poster .lines{ left:0; top:0; width:100%; height:100%; overflow:visible; }
.poster .lines line{ stroke:var(--red); stroke-width:3; shape-rendering:geometricPrecision; }
.poster .logo{ left:calc(92*var(--k)); top:calc(855*var(--k)); width:calc(218.4*var(--k)); height:auto; }

.t{ text-transform:uppercase; white-space:pre; }
.big{ font-size:calc(146.4*var(--k)); line-height:calc(129.6*var(--k)); font-variation-settings:"wdth" 80,"wght" 600; letter-spacing:-.03em; }
.mid{ font-size:calc(74.4*var(--k));  line-height:calc(69.03*var(--k));  font-variation-settings:"wdth" 80,"wght" 600; letter-spacing:-.01em; }
.sml{ font-size:calc(34.56*var(--k)); line-height:calc(31.1*var(--k));  font-variation-settings:"wdth" 75,"wght" 700; letter-spacing:.02em; }

.dates{ left:calc(92*var(--k));  top:calc(236*var(--k)); }
.year { left:calc(92*var(--k));  top:calc(651.6*var(--k)); }
.title{ left:calc(458*var(--k)); top:calc(236*var(--k)); }

.info { left:calc(458*var(--k)); top:calc(847.3*var(--k)); }
.doors{ left:calc(458*var(--k)); top:calc(1085.55*var(--k)); }
.presales{ left:calc(458*var(--k)); top:calc(1176.11*var(--k)); }

<script>
/* La flèche de « Préventes » glisse vers la droite puis revient au fil du scroll */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var el = document.querySelector(".arrow"), ticking = false;
  function update(){
    var x = (1 - Math.cos(window.scrollY / 80)) / 2 * 0.4;   // 0 → 0.4em → 0
    el.style.setProperty("--ax", x.toFixed(3) + "em");
    ticking = false;
  }
  addEventListener("scroll", function(){ if (!ticking){ ticking = true; requestAnimationFrame(update); } }, {passive:true});
  update();
})();
</script>
